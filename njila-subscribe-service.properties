# ─── Serveur ──────────────────────────────────────────────────────────────────
server.port=8089

# ─── Base de données PostgreSQL ────────────────────────────────────────────────
# ✅ CORRIGÉ : Utilise le service Docker PostgreSQL et le bon nom de DB
# Convention : njila-{domaine}-db  →  njila-subscribe-db
db.host=njila-subscribe-db
db.port=5432
db.name=njila_subscribe_db
db.username=njila
db.password=njila2026

# ─── Redis ────────────────────────────────────────────────────────────────────
# ✅ CORRIGÉ : Utilise le service Docker Redis
# Clés : njila:subscribe:{objet}:{id}  (voir doc référence section 4)
redis.host=njila-redis
redis.port=6379
redis.url=redis://njila-redis:6379/0

# ─── RabbitMQ ─────────────────────────────────────────────────────────────────
# ✅ DÉJÀ CORRECT : Utilise le service Docker RabbitMQ
# Exchange : njila.subscribe.exchange  (convention section 1)
rabbitmq.host=njila-rabbitmq
rabbitmq.port=5672
rabbitmq.username=guest
rabbitmq.password=guest
rabbitmq.exchange=njila.subscribe.exchange

# ─── Eureka ───────────────────────────────────────────────────────────────────
# ✅ CORRIGÉ : Utilise le service Docker Eureka
eureka.url=http://njila-registry-service:8761/eureka/

# ─── Django ───────────────────────────────────────────────────────────────────
django.secret-key=njila-secret-key-2026-change-in-production
django.debug=False
django.allowed-hosts=*