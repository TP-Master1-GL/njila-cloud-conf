# ─────────────────────────────────────────────────────────────────────────────
# NJILA PROXY SERVICE — Configuration FINALE (Corrigée)
# Config Server : njila-conf-service  |  Port : 8888
# ─────────────────────────────────────────────────────────────────────────────

# ─── Application ──────────────────────────────────────────────────────────────
server.port=8888
spring.application.name=njila-proxy-service

# ─── Eureka ───────────────────────────────────────────────────────────────────
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://njila-registry-service:8761/eureka/

# ─── Redis ────────────────────────────────────────────────────────────────────
spring.data.redis.host=njila-redis
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=2

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true
management.metrics.tags.application=${spring.application.name}

# ─── JWT & Auth Service ───────────────────────────────────────────────────────
njila.jwt.secret=njila-secret-key-2026-change-in-production
njila.auth.service.url=http://njila-auth-service:8081
njila.auth.service.eureka-name=njila-auth-service
njila.auth.service.internal-token=njila-shared-secret-2026

# ─── Discovery locator ────────────────────────────────────────────────────────
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.loadbalancer.ribbon.enabled=false

# ─── CORS global ──────────────────────────────────────────────────────────────
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders=Authorization,X-User-Id,X-User-Role
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=false

# ─────────────────────────────────────────────────────────────────────────────
# ROUTES SPRING CLOUD GATEWAY
# Routes ordonnées par spécificité (plus spécifique → moins spécifique)
# ─────────────────────────────────────────────────────────────────────────────

# ── 0. AUTH SERVICE — public ──────────────────────────────────────────────────
spring.cloud.gateway.routes[0].id=njila-auth-service-public
spring.cloud.gateway.routes[0].uri=lb://NJILA-AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/register,/api/auth/login,/api/auth/refresh,/api/auth/forgot-password,/api/auth/reset-password,/api/auth/health,/api/auth/validate-token,/api/auth/sync-admin,/api/auth/schema/**,/api/auth/docs/**
spring.cloud.gateway.routes[0].filters[0]=CircuitBreaker=name=authServiceCB,fallbackUri=forward:/fallback/auth

# ── 1. AUTH SERVICE — privé ───────────────────────────────────────────────────
spring.cloud.gateway.routes[1].id=njila-auth-service-private
spring.cloud.gateway.routes[1].uri=lb://NJILA-AUTH-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/logout,/api/auth/me,/api/auth/me/**,/api/auth/users/**
spring.cloud.gateway.routes[1].filters[0]=CircuitBreaker=name=authServiceCB,fallbackUri=forward:/fallback/auth

# ── 2. USER SERVICE — public (READ-ONLY, no auth) ──────────────────────────────
# GET  /api/users/health                       → health check
# GET  /api/users/avis/agence/{agenceId}       → avis publics d'une agence (paginé)
# GET  /api/users/avis/agence/{agenceId}/stats → stats avis d'une agence
# GET  /api/agences-filiales/**                → agrégat public agences+filiales
# GET  /api/users/schema/**                    → OpenAPI schema
# GET  /api/users/docs/**                      → Swagger UI
spring.cloud.gateway.routes[2].id=njila-user-service-public
spring.cloud.gateway.routes[2].uri=lb://NJILA-USER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/users/health,/api/users/avis/agence/**,/api/agences-filiales/**,/api/users/schema/**,/api/users/docs/**
spring.cloud.gateway.routes[2].filters[0]=CircuitBreaker=name=userServiceCB,fallbackUri=forward:/fallback/user

# ── 3. USER SERVICE — private ADMIN ────────────────────────────────────────────
# POST /api/users/admin/managers-globaux → créer ManagerGlobal
spring.cloud.gateway.routes[3].id=njila-user-service-admin
spring.cloud.gateway.routes[3].uri=lb://NJILA-USER-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/users/admin/**
spring.cloud.gateway.routes[3].filters[0]=CircuitBreaker=name=userServiceCB,fallbackUri=forward:/fallback/user

# ── 4. USER SERVICE — private AGENCE STAFF (TRÈS SPÉCIFIQUE) ──────────────────
# GET|POST /api/users/agences/{agenceId}/staff              → staff d'une agence
# GET|POST /api/users/agences/{agenceId}/employes           → employés d'une agence
# GET      /api/users/agences/{agenceId}/filiales/{filialeId}/employes → employés d'une filiale
# POST     /api/users/agences/{agenceId}/managers-locaux    → créer ManagerLocal
spring.cloud.gateway.routes[4].id=njila-user-service-agence-staff
spring.cloud.gateway.routes[4].uri=lb://NJILA-USER-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/users/agences/{agenceId}/staff,/api/users/agences/{agenceId}/employes,/api/users/agences/{agenceId}/filiales/{filialeId}/employes,/api/users/agences/{agenceId}/managers-locaux
spring.cloud.gateway.routes[4].filters[0]=CircuitBreaker=name=userServiceCB,fallbackUri=forward:/fallback/user

# ── 5. USER SERVICE — private FILIALE STAFF (SPÉCIFIQUE) ───────────────────────
# GET|POST /api/users/filiales/{filialeId}/employes        → employés d'une filiale
# GET|POST /api/users/filiales/{filialeId}/guichetiers     → guichetiers d'une filiale
# GET|POST /api/users/filiales/{filialeId}/chauffeurs      → chauffeurs d'une filiale
spring.cloud.gateway.routes[5].id=njila-user-service-filiale-staff
spring.cloud.gateway.routes[5].uri=lb://NJILA-USER-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/users/filiales/{filialeId}/employes,/api/users/filiales/{filialeId}/guichetiers,/api/users/filiales/{filialeId}/chauffeurs
spring.cloud.gateway.routes[5].filters[0]=CircuitBreaker=name=userServiceCB,fallbackUri=forward:/fallback/user

# ── 6. USER SERVICE — private STAFF DELETE (TRÈS SPÉCIFIQUE) ──────────────────
# DELETE /api/users/staff/{staffId} → supprimer un compte staff
spring.cloud.gateway.routes[6].id=njila-user-service-staff-delete
spring.cloud.gateway.routes[6].uri=lb://NJILA-USER-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/users/staff/{staffId}
spring.cloud.gateway.routes[6].filters[0]=CircuitBreaker=name=userServiceCB,fallbackUri=forward:/fallback/user

# ── 7. USER SERVICE — private GENERIC (CATCH-ALL) ──────────────────────────────
# GET|PUT|PATCH|DELETE /api/users/** → gestion profils génériques
# GET|POST /api/users/{userId}/avis  → gestion avis privés
spring.cloud.gateway.routes[7].id=njila-user-service-generic
spring.cloud.gateway.routes[7].uri=lb://NJILA-USER-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[7].filters[0]=CircuitBreaker=name=userServiceCB,fallbackUri=forward:/fallback/user

# ── 8. FLEET SERVICE — public (READ-ONLY) ────────────────────────────────────
# GET /api/health/                   → health check
# GET /api/agences/                  → liste des agences (FLEET)
# GET /api/agences/{id}/             → détail d'une agence (FLEET)
# GET /api/filiales/                 → liste des filiales
# GET /api/filiales/{id}/stats/      → stats filiale
# GET /api/bus/                      → liste des bus
# GET /api/bus/{id}/                 → détail d'un bus
# GET /api/bus/disponibles/          → bus disponibles
# GET /api/chauffeurs/               → liste des chauffeurs
# GET /api/trajets/                  → liste des trajets
# GET /api/voyages/                  → liste des voyages
# GET /api/voyages/recherche/        → recherche voyages
# GET /api/voyages/{id}/             → détail d'un voyage
# GET /api/annonces/                 → liste des annonces
# GET /api/avis/                     → liste des avis (FLEET, PAS USER)
# GET /api/avis/voyage/{id}/stats/   → stats avis d'un voyage
# GET /api/stats/                    → statistiques globales
# GET /api/schema/**                 → OpenAPI schema
# GET /api/docs/**                   → Swagger UI
spring.cloud.gateway.routes[8].id=njila-fleet-service-public
spring.cloud.gateway.routes[8].uri=lb://NJILA-FLEET-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/health/,/api/agences/,/api/agences/{id}/,/api/filiales/,/api/filiales/{id}/stats/,/api/bus/,/api/bus/disponibles/,/api/bus/{id}/,/api/chauffeurs/,/api/trajets/,/api/voyages/,/api/voyages/recherche/,/api/voyages/{id}/,/api/annonces/,/api/avis/,/api/avis/voyage/{id}/stats/,/api/stats/,/api/schema/**,/api/docs/**
spring.cloud.gateway.routes[8].filters[0]=CircuitBreaker=name=fleetServiceCB,fallbackUri=forward:/fallback/fleet

# ── 9. FLEET SERVICE — private (WRITE) ────────────────────────────────────────
# POST|PUT|PATCH|DELETE /api/agences/**       → gérer agences
# POST|PUT              /api/filiales/**      → créer/modifier filiales
# POST|PUT              /api/bus/**           → créer bus
# POST|PUT              /api/chauffeurs/**    → créer chauffeur
# GET|POST              /api/guichetiers/**   → guichetiers
# POST                  /api/trajets/**       → créer trajet
# POST|PUT              /api/voyages/**       → programmer voyage
# POST                  /api/annonces/**      → publier annonce
# POST                  /api/avis/**          → laisser un avis
spring.cloud.gateway.routes[9].id=njila-fleet-service-private
spring.cloud.gateway.routes[9].uri=lb://NJILA-FLEET-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/agences/**,/api/filiales/**,/api/bus/**,/api/chauffeurs/**,/api/guichetiers/**,/api/trajets/**,/api/voyages/**,/api/annonces/**,/api/avis/**
spring.cloud.gateway.routes[9].filters[0]=CircuitBreaker=name=fleetServiceCB,fallbackUri=forward:/fallback/fleet

# ── 10. BOOKING SERVICE ────────────────────────────────────────────────────────
spring.cloud.gateway.routes[10].id=njila-booking-service
spring.cloud.gateway.routes[10].uri=lb://NJILA-BOOKING-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/bookings/**
spring.cloud.gateway.routes[10].filters[0]=CircuitBreaker=name=bookingServiceCB,fallbackUri=forward:/fallback/booking

# ── 11. PAYMENT SERVICE ───────────────────────────────────────────────────────
spring.cloud.gateway.routes[11].id=njila-payment-service
spring.cloud.gateway.routes[11].uri=lb://NJILA-PAYEMENT-SERVICE
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/v1/payment/**
spring.cloud.gateway.routes[11].filters[0]=CircuitBreaker=name=paymentServiceCB,fallbackUri=forward:/fallback/payment

# ── 12. NOTIFICATION SERVICE — public ──────────────────────────────────────────
spring.cloud.gateway.routes[12].id=njila-notification-service-public
spring.cloud.gateway.routes[12].uri=lb://NJILA-NOTIFICATION-SERVICE
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/notifications/health,/api/notifications/schema/**,/api/notifications/docs/**
spring.cloud.gateway.routes[12].filters[0]=CircuitBreaker=name=notificationServiceCB,fallbackUri=forward:/fallback/notification

# ── 13. NOTIFICATION SERVICE — private ────────────────────────────────────────
spring.cloud.gateway.routes[13].id=njila-notification-service-private
spring.cloud.gateway.routes[13].uri=lb://NJILA-NOTIFICATION-SERVICE
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[13].filters[0]=CircuitBreaker=name=notificationServiceCB,fallbackUri=forward:/fallback/notification

# ── 14. SUBSCRIBE SERVICE — actuator ───────────────────────────────────────────
spring.cloud.gateway.routes[14].id=njila-subscribe-service-actuator
spring.cloud.gateway.routes[14].uri=lb://NJILA-SUBSCRIBE-SERVICE
spring.cloud.gateway.routes[14].predicates[0]=Path=/api/subscribe/actuator/**
spring.cloud.gateway.routes[14].filters[0]=RewritePath=/api/subscribe/actuator/(?<segment>.*), /actuator/${segment}
spring.cloud.gateway.routes[14].filters[1]=CircuitBreaker=name=subscribeServiceCB,fallbackUri=forward:/fallback/subscribe

# ── 15. SUBSCRIBE SERVICE — public & private ──────────────────────────────────
spring.cloud.gateway.routes[15].id=njila-subscribe-service
spring.cloud.gateway.routes[15].uri=lb://NJILA-SUBSCRIBE-SERVICE
spring.cloud.gateway.routes[15].predicates[0]=Path=/api/subscribe/**,/api/agencies/**
spring.cloud.gateway.routes[15].filters[0]=CircuitBreaker=name=subscribeServiceCB,fallbackUri=forward:/fallback/subscribe

# ── 16. FALLBACK ───────────────────────────────────────────────────────────────
spring.cloud.gateway.routes[16].id=fallback-route
spring.cloud.gateway.routes[16].uri=forward:/fallback
spring.cloud.gateway.routes[16].predicates[0]=Path=/fallback/**
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# ─── Circuit Breakers ─────────────────────────────────────────────────────────
resilience4j.circuitbreaker.instances.authServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.authServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.authServiceCB.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.authServiceCB.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.authServiceCB.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.userServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.userServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userServiceCB.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.userServiceCB.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.userServiceCB.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.fleetServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.fleetServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fleetServiceCB.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.fleetServiceCB.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.fleetServiceCB.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.bookingServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.bookingServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bookingServiceCB.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.bookingServiceCB.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.bookingServiceCB.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.paymentServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentServiceCB.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.paymentServiceCB.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.paymentServiceCB.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.notificationServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.notificationServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationServiceCB.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.notificationServiceCB.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.notificationServiceCB.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.subscribeServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.subscribeServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.subscribeServiceCB.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.subscribeServiceCB.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.subscribeServiceCB.sliding-window-type=COUNT_BASED

# ─── Timeouts ─────────────────────────────────────────────────────────────────
resilience4j.timelimiter.instances.authServiceCB.timeout-duration=15s
resilience4j.timelimiter.instances.userServiceCB.timeout-duration=15s
resilience4j.timelimiter.instances.fleetServiceCB.timeout-duration=15s
resilience4j.timelimiter.instances.bookingServiceCB.timeout-duration=15s
resilience4j.timelimiter.instances.paymentServiceCB.timeout-duration=15s
resilience4j.timelimiter.instances.notificationServiceCB.timeout-duration=15s
resilience4j.timelimiter.instances.subscribeServiceCB.timeout-duration=15s

# ─── Retry ────────────────────────────────────────────────────────────────────
resilience4j.retry.instances.authServiceCB.max-attempts=3
resilience4j.retry.instances.authServiceCB.wait-duration=1s
resilience4j.retry.instances.userServiceCB.max-attempts=3
resilience4j.retry.instances.userServiceCB.wait-duration=1s
resilience4j.retry.instances.fleetServiceCB.max-attempts=3
resilience4j.retry.instances.fleetServiceCB.wait-duration=1s
resilience4j.retry.instances.bookingServiceCB.max-attempts=3
resilience4j.retry.instances.bookingServiceCB.wait-duration=1s
resilience4j.retry.instances.paymentServiceCB.max-attempts=3
resilience4j.retry.instances.paymentServiceCB.wait-duration=1s
resilience4j.retry.instances.notificationServiceCB.max-attempts=3
resilience4j.retry.instances.notificationServiceCB.wait-duration=1s
resilience4j.retry.instances.subscribeServiceCB.max-attempts=3
resilience4j.retry.instances.subscribeServiceCB.wait-duration=1s
