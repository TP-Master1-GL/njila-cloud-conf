# ─────────────────────────────────────────────────────────────────────────────
# NJILA PROXY SERVICE — Configuration complète (Optimisée)
# Config Server : njila-conf-service  |  Port : 8888
# ─────────────────────────────────────────────────────────────────────────────

# ─── Application ──────────────────────────────────────────────────────────────
server.port=8888
spring.application.name=njila-proxy-service

# ─── Eureka ───────────────────────────────────────────────────────────────────
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://njila-registry-service:8761/eureka/

# ─── Redis ────────────────────────────────────────────────────────────────────
spring.data.redis.host=njila-redis
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=2

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true
management.metrics.tags.application=${spring.application.name}

# ─── JWT & Auth Service ───────────────────────────────────────────────────────
njila.jwt.secret=njila-secret-key-2026-change-in-production
njila.auth.service.url=http://njila-auth-service:8081
njila.auth.service.eureka-name=njila-auth-service
njila.auth.service.internal-token=njila-shared-secret-2026

# ─── Discovery locator ────────────────────────────────────────────────────────
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.loadbalancer.ribbon.enabled=false

# ─── CORS global ──────────────────────────────────────────────────────────────
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders=Authorization,X-User-Id,X-User-Role
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=false

# ─────────────────────────────────────────────────────────────────────────────
# ROUTES SPRING CLOUD GATEWAY (Ordonnées par spécificité)
# ⚠️  IMPORTANT : Les routes PLUS SPÉCIFIQUES d'abord, les GÉNÉRIQUES ensuite
# ─────────────────────────────────────────────────────────────────────────────

# ── 1. AUTH SERVICE — public ──────────────────────────────────────────────────
# POST /api/auth/register          → inscription voyageur
# POST /api/auth/login             → connexion
# POST /api/auth/refresh           → rafraîchir tokens
# POST /api/auth/forgot-password   → demande reset password
# POST /api/auth/reset-password    → confirmer reset password
# GET  /api/auth/health            → health check
# POST /api/auth/validate-token    → validation token interne (X-Internal-Token)
# POST /api/auth/sync-admin        → bootstrap admin (utilitaire)
# GET  /api/auth/schema/**         → OpenAPI schema
# GET  /api/auth/docs/**           → Swagger UI
spring.cloud.gateway.routes[0].id=njila-auth-service-public
spring.cloud.gateway.routes[0].uri=lb://NJILA-AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/register,/api/auth/login,/api/auth/refresh,/api/auth/forgot-password,/api/auth/reset-password,/api/auth/health,/api/auth/validate-token,/api/auth/sync-admin,/api/auth/schema/**,/api/auth/docs/**
spring.cloud.gateway.routes[0].filters[0]=CircuitBreaker=name=authServiceCB,fallbackUri=forward:/fallback/auth

# ── 2. AUTH SERVICE — privé ───────────────────────────────────────────────────
# POST  /api/auth/logout             → déconnexion (+ ?all=true pour toutes sessions)
# GET   /api/auth/me                 → profil utilisateur connecté
# PATCH /api/auth/me/profile         → modifier profil
# PATCH /api/auth/me/photo           → modifier photo de profil
# PATCH /api/auth/users/{id}/status  → activer/suspendre un compte (Admin)
spring.cloud.gateway.routes[1].id=njila-auth-service-private
spring.cloud.gateway.routes[1].uri=lb://NJILA-AUTH-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/logout,/api/auth/me,/api/auth/me/**,/api/auth/users/**
spring.cloud.gateway.routes[1].filters[0]=CircuitBreaker=name=authServiceCB,fallbackUri=forward:/fallback/auth

# ── 3. USER SERVICE — staff & hierarchy (SPÉCIFIQUE) ───────────────────────────
# ⚠️  Routes TRÈS SPÉCIFIQUES pour éviter les conflits avec FLEET
# POST  /api/admin/managers-globaux            → créer ManagerGlobal (Admin)
# GET|POST /api/agences/{id}/staff            → lister staff d'une agence
# GET|POST /api/agences/{id}/employes         → lister employés d'une agence
# GET      /api/agences/{id}/filiales/{id}/employes → employés d'une filiale
# POST     /api/agences/{id}/managers-locaux  → créer ManagerLocal
# GET|POST /api/filiales/{id}/employes        → employés d'une filiale
# GET|POST /api/filiales/{id}/guichetiers     → guichetiers d'une filiale
# GET|POST /api/filiales/{id}/chauffeurs      → chauffeurs d'une filiale
# DELETE   /api/staff/{id}                    → supprimer un compte staff
spring.cloud.gateway.routes[2].id=njila-user-service-staff
spring.cloud.gateway.routes[2].uri=lb://NJILA-USER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/admin/managers-globaux,/api/agences/{id}/staff,/api/agences/{id}/employes,/api/agences/{id}/filiales/{id}/employes,/api/agences/{id}/managers-locaux,/api/filiales/{id}/employes,/api/filiales/{id}/guichetiers,/api/filiales/{id}/chauffeurs,/api/staff/**
spring.cloud.gateway.routes[2].filters[0]=CircuitBreaker=name=userServiceCB,fallbackUri=forward:/fallback/user

# ── 4. USER SERVICE — profiles & accounts (GÉNÉRIQUE) ──────────────────────────
# GET|PUT|PATCH|DELETE /api/users/**          → gestion profils utilisateurs
spring.cloud.gateway.routes[3].id=njila-user-service-profiles
spring.cloud.gateway.routes[3].uri=lb://NJILA-USER-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[3].filters[0]=CircuitBreaker=name=userServiceCB,fallbackUri=forward:/fallback/user

# ── 5. USER SERVICE — public (avis & statistiques) ──────────────────────────────
# GET /api/users/health              → health check
# GET /api/avis/agence/{id}          → avis publics paginés d'une agence
# GET /api/avis/agence/{id}/stats    → note moyenne d'une agence
# GET /api/agences-filiales/**       → agrégat public agences+filiales
# GET /api/users/schema/**           → OpenAPI schema
# GET /api/users/docs/**             → Swagger UI
spring.cloud.gateway.routes[4].id=njila-user-service-public
spring.cloud.gateway.routes[4].uri=lb://NJILA-USER-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/users/health,/api/avis/agence/**,/api/avis/agence/**/stats,/api/agences-filiales/**,/api/users/schema/**,/api/users/docs/**
spring.cloud.gateway.routes[4].filters[0]=CircuitBreaker=name=userServiceCB,fallbackUri=forward:/fallback/user

# ── 6. FLEET SERVICE — public (READ-ONLY) ────────────────────────────────────
# ⚠️  IMPORTANT : Cette route doit venir APRÈS les routes USER spécifiques
# Tous les endpoints en lecture seule (GET) du fleet-service sont publics.
#
# GET /api/health/                          → health check du service
# GET /api/agences/                         → liste des agences
# GET /api/agences/{id}/                    → détail d'une agence
# GET /api/filiales/                        → liste des filiales
# GET /api/filiales/{id}/stats/             → statistiques d'une filiale
# GET /api/bus/                             → liste des bus
# GET /api/bus/{id}/                        → détail d'un bus
# GET /api/bus/disponibles/                 → bus disponibles
# GET /api/chauffeurs/                      → liste des chauffeurs
# GET /api/trajets/                         → liste des trajets
# GET /api/voyages/                         → liste des voyages
# GET /api/voyages/recherche/               → recherche voyages (depart, arrivee, date)
# GET /api/voyages/{id}/                    → détail d'un voyage
# GET /api/annonces/                        → liste des annonces
# GET /api/avis/                            → liste des avis approuvés
# GET /api/avis/voyage/{id}/stats/          → statistiques des avis d'un voyage
# GET /api/stats/                           → statistiques globales des bus
# GET /api/schema/**                        → OpenAPI schema
# GET /api/docs/**                          → Swagger UI
spring.cloud.gateway.routes[5].id=njila-fleet-service-public
spring.cloud.gateway.routes[5].uri=lb://NJILA-FLEET-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/health/,/api/agences/,/api/agences/{id}/,/api/filiales/,/api/filiales/{id}/stats/,/api/bus/,/api/bus/disponibles/,/api/bus/{id}/,/api/chauffeurs/,/api/trajets/,/api/voyages/,/api/voyages/recherche/,/api/voyages/{id}/,/api/annonces/,/api/avis/,/api/avis/voyage/{id}/stats/,/api/stats/,/api/schema/**,/api/docs/**
spring.cloud.gateway.routes[5].filters[0]=CircuitBreaker=name=fleetServiceCB,fallbackUri=forward:/fallback/fleet
# ⚠️  NOTE: Cette route inclut explicitement les slash terminaux (/) pour éviter les conflits
#    avec les routes /api/avis/* du USER-SERVICE

# ── 7. FLEET SERVICE — privé (WRITE operations) ───────────────────────────────
# ⚠️  IMPORTANT : Cette route doit venir APRÈS les routes publiques correspondantes
# Tous les endpoints d'écriture (POST/PUT/PATCH/DELETE) + guichetiers (privé en lecture aussi).
#
# POST|PUT|PATCH|DELETE /api/agences/**              → gérer agences (Admin)
# POST|PUT              /api/filiales/**              → créer/modifier filiales (Manager Global+)
# POST|PUT              /api/bus/**                   → créer bus, changer état (Manager Local+)
# POST|PUT              /api/chauffeurs/**            → créer chauffeur, changer dispo (Manager Local+)
# GET|POST              /api/guichetiers/**           → liste & création guichetiers (Manager Local+)
# POST                  /api/trajets/**               → créer trajet (Manager Global+)
# POST|PUT              /api/voyages/**               → programmer, statut, assign-bus, assign-chauffeur (Manager Local+)
# POST                  /api/annonces/**              → publier annonce (Manager Local+)
# POST                  /api/avis/**                  → laisser un avis (Voyageur)
spring.cloud.gateway.routes[6].id=njila-fleet-service-private
spring.cloud.gateway.routes[6].uri=lb://NJILA-FLEET-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/agences/**,/api/filiales/**,/api/bus/**,/api/chauffeurs/**,/api/guichetiers/**,/api/trajets/**,/api/voyages/**,/api/annonces/**,/api/avis/**
spring.cloud.gateway.routes[6].filters[0]=CircuitBreaker=name=fleetServiceCB,fallbackUri=forward:/fallback/fleet

# ── 8. BOOKING SERVICE ────────────────────────────────────────────────────────
# Tous les endpoints booking — tous privés :
# POST   /api/bookings/                         → créer réservation
# GET    /api/bookings/{id}                     → détail réservation
# GET    /api/bookings/voyage/{voyageId}         → réservations d'un voyage
# GET    /api/bookings/history/{userId}          → historique d'un voyageur
# GET    /api/bookings/stats/{filialeId}         → statistiques filiale
# PATCH  /api/bookings/{id}/cancel              → annuler réservation
# PATCH  /api/bookings/{id}/confirm             → confirmer paiement espèces
# PATCH  /api/bookings/{id}/convert-ticket      → convertir billet web → embarquement
# GET    /api/bookings/{id}/ticket              → infos billet JSON
# GET    /api/bookings/{id}/ticket/pdf          → télécharger billet PDF
# POST   /api/bookings/depart/valider-billet    → valider billet au départ
# POST   /api/bookings/depart/cloturer          → clôturer départ d'un voyage
# GET    /api/bookings/fidelite/{idVoyageur}    → compteur fidélité
spring.cloud.gateway.routes[7].id=njila-booking-service
spring.cloud.gateway.routes[7].uri=lb://NJILA-BOOKING-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/bookings/**
spring.cloud.gateway.routes[7].filters[0]=CircuitBreaker=name=bookingServiceCB,fallbackUri=forward:/fallback/booking

# ── 9. PAYMENT SERVICE ───────────────────────────────────────────────────────
# Tous les endpoints paiement — tous privés :
# PATCH /api/v1/payment/confirm-cash/{id}       → confirmer paiement espèces (Guichetier)
# GET   /api/v1/payment/status/{id}             → statut d'un paiement
# GET   /api/v1/payment/passenger/{id}          → paiements d'un passager
# PATCH /api/v1/payment/cancel/{id}             → annuler un paiement
# GET   /api/v1/payment/all                     → tous les paiements (Admin)
# POST  /api/v1/payment/refund/{id}             → remboursement (Admin/Manager)
spring.cloud.gateway.routes[8].id=njila-payment-service
spring.cloud.gateway.routes[8].uri=lb://NJILA-PAYEMENT-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/v1/payment/**
spring.cloud.gateway.routes[8].filters[0]=CircuitBreaker=name=paymentServiceCB,fallbackUri=forward:/fallback/payment

# ── 10. NOTIFICATION SERVICE — public ─────────────────────────────────────────
# GET /api/notifications/health        → health check
# GET /api/notifications/schema/**     → OpenAPI schema
# GET /api/notifications/docs/**       → Swagger UI
spring.cloud.gateway.routes[9].id=njila-notification-service-public
spring.cloud.gateway.routes[9].uri=lb://NJILA-NOTIFICATION-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/notifications/health,/api/notifications/schema/**,/api/notifications/docs/**
spring.cloud.gateway.routes[9].filters[0]=CircuitBreaker=name=notificationServiceCB,fallbackUri=forward:/fallback/notification

# ── 11. NOTIFICATION SERVICE — privé ─────────────────────────────────────────
# GET /api/notifications/history/{userId}  → historique notifications d'un utilisateur
spring.cloud.gateway.routes[10].id=njila-notification-service-private
spring.cloud.gateway.routes[10].uri=lb://NJILA-NOTIFICATION-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[10].filters[0]=CircuitBreaker=name=notificationServiceCB,fallbackUri=forward:/fallback/notification

# ── 12. SUBSCRIBE SERVICE — actuator (public) ────────────────────────────────
spring.cloud.gateway.routes[11].id=njila-subscribe-service-actuator
spring.cloud.gateway.routes[11].uri=lb://NJILA-SUBSCRIBE-SERVICE
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/subscribe/actuator/**
spring.cloud.gateway.routes[11].filters[0]=RewritePath=/api/subscribe/actuator/(?<segment>.*), /actuator/${segment}
spring.cloud.gateway.routes[11].filters[1]=CircuitBreaker=name=subscribeServiceCB,fallbackUri=forward:/fallback/subscribe

# ── 13. SUBSCRIBE SERVICE — public & privé ───────────────────────────────────
# Public  → GET /api/agencies/agences             → liste des agences
#         → GET /api/agencies/agences/{agence_id} → détail agence + abonnement actuel
# Privé   → POST /api/subscribe/agences/{id}/souscrire      → souscrire (Admin)
#         → POST /api/subscribe/agences/{id}/renouveler      → renouveler (Admin)
#         → POST /api/subscribe/agences/{id}/suspendre       → suspendre (Admin)
#         → POST /api/subscribe/agences/{id}/reactiver       → réactiver (Admin)
#         → POST /api/subscribe/agences/{id}/demande-essai   → essai gratuit (Agence)
#         → GET  /api/subscribe/agences/{id}/mon-abonnement  → mon abonnement (Agence)
#         → GET  /api/subscribe/verify/{agence_id}           → vérification statut (Proxy)
#         → GET  /api/subscribe/modules/{agence_id}          → modules autorisés (Interne)
#         → GET  /api/subscribe/tableau-de-bord              → dashboard stats (Admin)
spring.cloud.gateway.routes[12].id=njila-subscribe-service-private
spring.cloud.gateway.routes[12].uri=lb://NJILA-SUBSCRIBE-SERVICE
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/subscribe/**,/api/agencies/**
spring.cloud.gateway.routes[12].filters[0]=CircuitBreaker=name=subscribeServiceCB,fallbackUri=forward:/fallback/subscribe

# ── 14. FALLBACK ──────────────────────────────────────────────────────────────
spring.cloud.gateway.routes[13].id=fallback-route
spring.cloud.gateway.routes[13].uri=forward:/fallback
spring.cloud.gateway.routes[13].predicates[0]=Path=/fallback/**
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# ─────────────────────────────────────────────────────────────────────────────
# RÉSILIENCE & CIRCUIT BREAKERS
# ─────────────────────────────────────────────────────────────────────────────

resilience4j.circuitbreaker.instances.authServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.authServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.authServiceCB.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.authServiceCB.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.authServiceCB.sliding-window-type=COUNT_BASED

