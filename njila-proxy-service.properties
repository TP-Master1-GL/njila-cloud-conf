# ─── Serveur ──────────────────────────────────────────────────────────────────
server.port=8888
spring.application.name=njila-proxy-service

# ─── Eureka ───────────────────────────────────────────────────────────────────
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ─── Redis ────────────────────────────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=2

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true
management.metrics.tags.application=${spring.application.name}

# ─── JWT ──────────────────────────────────────────────────────────────────────
njila.jwt.secret=njila-dev-secret-change-in-prod-!!
njila.auth.service.url=http://localhost:8081
njila.auth.service.validate-token-url=${njila.auth.service.url}/api/auth/validate-token
njila.auth.service.internal-token=njila-shared-secret-2026

# ─── URLs des services internes (fallback si Eureka indisponible) ─────────────
njila.services.auth.url=http://localhost:8081
njila.services.user.url=http://localhost:8082
njila.services.booking.url=http://localhost:8083
njila.services.payment.url=http://localhost:8084
njila.services.notification.url=http://localhost:8085
njila.services.fleet.url=http://localhost:8088
njila.services.subscribe.url=http://localhost:8090

# ─── Rate Limiting Configuration ──────────────────────────────────────────────
njila.rate-limiting.enabled=true
njila.rate-limiting.auth-service.replenish-rate=10
njila.rate-limiting.auth-service.burst-capacity=20
njila.rate-limiting.user-service.replenish-rate=20
njila.rate-limiting.user-service.burst-capacity=40
njila.rate-limiting.fleet-service.replenish-rate=30
njila.rate-limiting.fleet-service.burst-capacity=60
njila.rate-limiting.booking-service.replenish-rate=15
njila.rate-limiting.booking-service.burst-capacity=30
njila.rate-limiting.payment-service.replenish-rate=5
njila.rate-limiting.payment-service.burst-capacity=10
njila.rate-limiting.notification-service.replenish-rate=50
njila.rate-limiting.notification-service.burst-capacity=100
njila.rate-limiting.subscribe-service.replenish-rate=10
njila.rate-limiting.subscribe-service.burst-capacity=20

# ─── Circuit Breaker Configuration ────────────────────────────────────────────
resilience4j.circuitbreaker.instances.auth-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.auth-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.auth-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.auth-service.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.auth-service.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.user-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.user-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.user-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.user-service.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.user-service.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.fleet-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.fleet-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fleet-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.fleet-service.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.fleet-service.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.booking-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.booking-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.booking-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.booking-service.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.booking-service.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.payment-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.payment-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.payment-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.payment-service.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.payment-service.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.notification-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.notification-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notification-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.notification-service.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.notification-service.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.subscribe-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.subscribe-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.subscribe-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.subscribe-service.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.subscribe-service.sliding-window-type=COUNT_BASED

# ─── Resilience4j Timeout Configuration ───────────────────────────────────────
resilience4j.timelimiter.instances.auth-service.timeout-duration=5s
resilience4j.timelimiter.instances.user-service.timeout-duration=5s
resilience4j.timelimiter.instances.fleet-service.timeout-duration=10s
resilience4j.timelimiter.instances.booking-service.timeout-duration=10s
resilience4j.timelimiter.instances.payment-service.timeout-duration=15s
resilience4j.timelimiter.instances.notification-service.timeout-duration=5s
resilience4j.timelimiter.instances.subscribe-service.timeout-duration=5s

# ─── Retry Configuration ──────────────────────────────────────────────────────
resilience4j.retry.instances.auth-service.max-attempts=3
resilience4j.retry.instances.auth-service.wait-duration=1s
resilience4j.retry.instances.user-service.max-attempts=3
resilience4j.retry.instances.user-service.wait-duration=1s
resilience4j.retry.instances.fleet-service.max-attempts=3
resilience4j.retry.instances.fleet-service.wait-duration=1s
resilience4j.retry.instances.booking-service.max-attempts=3
resilience4j.retry.instances.booking-service.wait-duration=1s

