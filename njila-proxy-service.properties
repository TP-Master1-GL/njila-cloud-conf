# ─────────────────────────────────────────────────────────────────────────────
# NJILA PROXY SERVICE — Configuration complète
# Config Server : njila-conf-service  |  Port : 8888
# ─────────────────────────────────────────────────────────────────────────────

# ─── Application ──────────────────────────────────────────────────────────────
server.port=8888
spring.application.name=njila-proxy-service

# ─── Eureka ───────────────────────────────────────────────────────────────────
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://njila-registry-service:8761/eureka/
eureka.instance.prefer-ip-address=true

# ─── Redis (Rate Limiting) ────────────────────────────────────────────────────
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=2

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true
management.metrics.tags.application=${spring.application.name}

# ─── JWT & Auth Service ───────────────────────────────────────────────────────
njila.jwt.secret=njila-secret-key-2026-change-in-production
njila.auth.service.url=http://njila-auth-service:8081
njila.auth.service.eureka-name=njila-auth-service
njila.auth.service.internal-token=njila-shared-secret-2026

# ─── Discovery locator (routes automatiques par nom de service Eureka) ────────
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.loadbalancer.ribbon.enabled=false

# ─────────────────────────────────────────────────────────────────────────────
# ROUTES SPRING CLOUD GATEWAY
# Chaque service est préfixé /api/<domaine> → lb://<service-eureka>
# ─────────────────────────────────────────────────────────────────────────────

# ── 1. AUTH SERVICE (Django — port 8081) ─────────────────────────────────────
# Endpoints publics : register, login, refresh, forgot/reset-password,
#                     health, validate-token, schema, docs
# Endpoints protégés : logout, me, me/profile, me/photo, users/{id}/status,
#                       sync-admin

spring.cloud.gateway.routes[0].id=njila-auth-service-public
spring.cloud.gateway.routes[0].uri=lb://njila-auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/register,/api/auth/login,/api/auth/refresh,/api/auth/forgot-password,/api/auth/reset-password,/api/auth/health,/api/auth/validate-token,/api/schema/**,/api/docs/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/(?<segment>.*), /api/${segment}
spring.cloud.gateway.routes[0].filters[1]=CircuitBreaker=name=authServiceCB,fallbackUri=forward:/fallback/auth

spring.cloud.gateway.routes[1].id=njila-auth-service-private
spring.cloud.gateway.routes[1].uri=lb://njila-auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/logout,/api/auth/me,/api/auth/me/profile,/api/auth/me/photo,/api/auth/sync-admin,/api/auth/users/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/(?<segment>.*), /api/${segment}
spring.cloud.gateway.routes[1].filters[1]=CircuitBreaker=name=authServiceCB,fallbackUri=forward:/fallback/auth
spring.cloud.gateway.routes[1].filters[2]=RequestRateLimiter=redis-rate-limiter.replenishRate=10,redis-rate-limiter.burstCapacity=20,key-resolver=#{@userKeyResolver}

# ── 2. USER SERVICE (Spring Boot — port 8082) ─────────────────────────────────
# Endpoints publics : health, avis/agence/**, agences-filiales/**
# Endpoints protégés : users/**, admin/**, agences/**/staff, filiales/**/employes …

spring.cloud.gateway.routes[2].id=njila-user-service-public
spring.cloud.gateway.routes[2].uri=lb://njila-user-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/users/health,/api/avis/agence/**,/api/agences-filiales/**
spring.cloud.gateway.routes[2].filters[0]=CircuitBreaker=name=userServiceCB,fallbackUri=forward:/fallback/user
spring.cloud.gateway.routes[2].filters[1]=RequestRateLimiter=redis-rate-limiter.replenishRate=20,redis-rate-limiter.burstCapacity=40,key-resolver=#{@ipKeyResolver}

spring.cloud.gateway.routes[3].id=njila-user-service-private
spring.cloud.gateway.routes[3].uri=lb://njila-user-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/users/**,/api/admin/**,/api/agences/**,/api/filiales/**,/api/staff/**
spring.cloud.gateway.routes[3].filters[0]=CircuitBreaker=name=userServiceCB,fallbackUri=forward:/fallback/user
spring.cloud.gateway.routes[3].filters[1]=RequestRateLimiter=redis-rate-limiter.replenishRate=20,redis-rate-limiter.burstCapacity=40,key-resolver=#{@userKeyResolver}

# ── 3. FLEET SERVICE (Django — port 8083) ─────────────────────────────────────
# Toutes les routes passent par /api/fleet/**  → réécriture vers le service Django
# Endpoints : agences, filiales, bus, chauffeurs, guichetiers, trajets,
#             voyages, annonces, avis, assignations, health, stats

spring.cloud.gateway.routes[4].id=njila-fleet-service-health
spring.cloud.gateway.routes[4].uri=lb://njila-fleet-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/fleet/health/,/api/fleet/health
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/api/fleet/(?<segment>.*), /${segment}
spring.cloud.gateway.routes[4].filters[1]=CircuitBreaker=name=fleetServiceCB,fallbackUri=forward:/fallback/fleet

spring.cloud.gateway.routes[5].id=njila-fleet-service-private
spring.cloud.gateway.routes[5].uri=lb://njila-fleet-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/fleet/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/api/fleet/(?<segment>.*), /${segment}
spring.cloud.gateway.routes[5].filters[1]=CircuitBreaker=name=fleetServiceCB,fallbackUri=forward:/fallback/fleet
spring.cloud.gateway.routes[5].filters[2]=RequestRateLimiter=redis-rate-limiter.replenishRate=30,redis-rate-limiter.burstCapacity=60,key-resolver=#{@userKeyResolver}

# ── 4. BOOKING SERVICE (Spring Boot — port 8084) ──────────────────────────────
# Endpoints : /api/bookings/**  (réservations, billets, fidélité, départ)

spring.cloud.gateway.routes[6].id=njila-booking-service
spring.cloud.gateway.routes[6].uri=lb://njila-booking-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/bookings/**
spring.cloud.gateway.routes[6].filters[0]=CircuitBreaker=name=bookingServiceCB,fallbackUri=forward:/fallback/booking
spring.cloud.gateway.routes[6].filters[1]=RequestRateLimiter=redis-rate-limiter.replenishRate=15,redis-rate-limiter.burstCapacity=30,key-resolver=#{@userKeyResolver}

# ── 5. PAYMENT SERVICE (Spring Boot — port 8085) ──────────────────────────────
# Endpoints : /api/v1/payment/**  (confirm-cash, status, passenger, cancel,
#                                   all, refund)

spring.cloud.gateway.routes[7].id=njila-payment-service
spring.cloud.gateway.routes[7].uri=lb://njila-payment-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/payment/**
spring.cloud.gateway.routes[7].filters[0]=CircuitBreaker=name=paymentServiceCB,fallbackUri=forward:/fallback/payment
spring.cloud.gateway.routes[7].filters[1]=RequestRateLimiter=redis-rate-limiter.replenishRate=5,redis-rate-limiter.burstCapacity=10,key-resolver=#{@userKeyResolver}

# ── 6. NOTIFICATION SERVICE (Node.js — port 8086) ────────────────────────────
# Endpoints : /api/notifications/health, /api/notifications/history/{userId}

spring.cloud.gateway.routes[8].id=njila-notification-service
spring.cloud.gateway.routes[8].uri=lb://njila-notification-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[8].filters[0]=CircuitBreaker=name=notificationServiceCB,fallbackUri=forward:/fallback/notification
spring.cloud.gateway.routes[8].filters[1]=RequestRateLimiter=redis-rate-limiter.replenishRate=50,redis-rate-limiter.burstCapacity=100,key-resolver=#{@userKeyResolver}

# ── 7. SUBSCRIBE SERVICE (Django — port 8087) ────────────────────────────────
# Endpoints publics  : /actuator/**
# Endpoints protégés : /api/agencies/**, /api/subscribe/**,
#                       /actuator/verify/**, /actuator/modules/**,
#                       /actuator/tableau-de-bord

spring.cloud.gateway.routes[9].id=njila-subscribe-service-actuator
spring.cloud.gateway.routes[9].uri=lb://njila-subscribe-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/subscribe/actuator/**
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/api/subscribe/actuator/(?<segment>.*), /actuator/${segment}
spring.cloud.gateway.routes[9].filters[1]=CircuitBreaker=name=subscribeServiceCB,fallbackUri=forward:/fallback/subscribe

spring.cloud.gateway.routes[10].id=njila-subscribe-service-private
spring.cloud.gateway.routes[10].uri=lb://njila-subscribe-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/subscribe/**,/api/agencies/**
spring.cloud.gateway.routes[10].filters[0]=CircuitBreaker=name=subscribeServiceCB,fallbackUri=forward:/fallback/subscribe
spring.cloud.gateway.routes[10].filters[1]=RequestRateLimiter=redis-rate-limiter.replenishRate=10,redis-rate-limiter.burstCapacity=20,key-resolver=#{@userKeyResolver}

# ── 8. FALLBACK (interne au proxy) ────────────────────────────────────────────
spring.cloud.gateway.routes[11].id=fallback-route
spring.cloud.gateway.routes[11].uri=forward:/fallback
spring.cloud.gateway.routes[11].predicates[0]=Path=/fallback/**

# ─── CORS global ──────────────────────────────────────────────────────────────
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders=Authorization,X-User-Id,X-User-Role

# ─── Circuit Breakers ─────────────────────────────────────────────────────────
resilience4j.circuitbreaker.instances.authServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.authServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.authServiceCB.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.authServiceCB.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.authServiceCB.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.userServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.userServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userServiceCB.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.userServiceCB.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.userServiceCB.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.fleetServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.fleetServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fleetServiceCB.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.fleetServiceCB.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.fleetServiceCB.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.bookingServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.bookingServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bookingServiceCB.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.bookingServiceCB.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.bookingServiceCB.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.paymentServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentServiceCB.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.paymentServiceCB.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.paymentServiceCB.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.notificationServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.notificationServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationServiceCB.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.notificationServiceCB.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.notificationServiceCB.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.subscribeServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.subscribeServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.subscribeServiceCB.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.subscribeServiceCB.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.subscribeServiceCB.sliding-window-type=COUNT_BASED

# ─── Timeouts ─────────────────────────────────────────────────────────────────
resilience4j.timelimiter.instances.authServiceCB.timeout-duration=5s
resilience4j.timelimiter.instances.userServiceCB.timeout-duration=5s
resilience4j.timelimiter.instances.fleetServiceCB.timeout-duration=10s
resilience4j.timelimiter.instances.bookingServiceCB.timeout-duration=10s
resilience4j.timelimiter.instances.paymentServiceCB.timeout-duration=15s
resilience4j.timelimiter.instances.notificationServiceCB.timeout-duration=5s
resilience4j.timelimiter.instances.subscribeServiceCB.timeout-duration=5s

# ─── Retry ────────────────────────────────────────────────────────────────────
resilience4j.retry.instances.authServiceCB.max-attempts=3
resilience4j.retry.instances.authServiceCB.wait-duration=1s
resilience4j.retry.instances.userServiceCB.max-attempts=3
resilience4j.retry.instances.userServiceCB.wait-duration=1s
resilience4j.retry.instances.fleetServiceCB.max-attempts=3
resilience4j.retry.instances.fleetServiceCB.wait-duration=1s
resilience4j.retry.instances.bookingServiceCB.max-attempts=3
resilience4j.retry.instances.bookingServiceCB.wait-duration=1s
resilience4j.retry.instances.paymentServiceCB.max-attempts=3
resilience4j.retry.instances.paymentServiceCB.wait-duration=1s
resilience4j.retry.instances.notificationServiceCB.max-attempts=3
resilience4j.retry.instances.notificationServiceCB.wait-duration=1s
resilience4j.retry.instances.subscribeServiceCB.max-attempts=3
resilience4j.retry.instances.subscribeServiceCB.wait-duration=1s