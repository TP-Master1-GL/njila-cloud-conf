# ── Serveur ( — Microservices et ports) ─────────────────────────────────────
server.port=8081

# ── Base de données (§3 — njila-auth-db | PostgreSQL 15) ─────────────────────
# ✅ CORRIGÉ : Utilise le service Docker PostgreSQL et le bon nom de DB
db.name=njila_db
db.user=njila
db.password=njila2026
db.host=njila-auth-db
db.port=5432

# ───────────────Secret key───────────────────
SECRET_KEY=njila-secret-key-2026-change-in-production

# ── Redis (§4 — AWS ElastiCache | port 6379) ──────────────────────────────────
# ✅ CORRIGÉ : Utilise le service Docker Redis
redis.host=njila-redis
redis.port=6379

# ── RabbitMQ (§5 — AWS MQ Broker | port 5672) ────────────────────────────────
# ✅ DÉJÀ CORRECT : Utilise le service Docker RabbitMQ
rabbitmq.host=njila-rabbitmq
rabbitmq.port=5672
rabbitmq.user=guest
rabbitmq.pass=guest
rabbitmq.vhost=/

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.access.minutes=15
jwt.refresh.days=7

# ── Eureka ───────────────────────────────────────────────────────────────────
# ✅ CORRIGÉ : Utilise le service Docker Eureka
eureka.url=http://njila-registry-service:8761/eureka/