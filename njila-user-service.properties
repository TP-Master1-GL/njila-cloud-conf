# =============================================================================
# NJILA - User Service Configuration
# =============================================================================

# ── Serveur ────────────────────────────────────────────────────────────────────
server.port=8082

# ── Eureka Discovery ───────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# eureka.instance.instance-id=${spring.application.name}:${server.port}

# ── PostgreSQL ─────────────────────────────────────────────────────────────────
# Base dédiée au user-service : njila-user-db
# Créer avec : CREATE DATABASE "njila-user-db"; GRANT ALL ON DATABASE "njila-user-db" TO njila;
spring.datasource.url=jdbc:postgresql://localhost:5432/njila-user-db
spring.datasource.username=njila
spring.datasource.password=njila2026
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de connexions HikariCP
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=NjilaUserHikariPool

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── Redis ──────────────────────────────────────────────────────────────────────
# Cache profils : TTL 10 min (diagramme activité getProfile)
# Cache listes  : TTL 5 min
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=1

# ── RabbitMQ ───────────────────────────────────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Retry automatique si RabbitMQ indisponible au démarrage
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000ms

# Acknowledgement manuel pour garantir la fiabilité
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=1

# ── JWT Secret ─────────────────────────────────────────────────────────────────
njila.jwt.secret=njila-dev-secret-change-in-prod-!!

# ── Actuator ───────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Informations affichées dans /actuator/info
info.app.name=njila-user-service
info.app.version=1.3.0
info.app.description=Service de gestion des profils utilisateurs - NJILA

# ── Logging ────────────────────────────────────────────────────────────────────
#logging.level.com.njila.userservice=INFO
#logging.level.com.njila.userservice.events=DEBUG
#logging.level.org.springframework.amqp=WARN
#logging.level.org.hibernate.SQL=WARN
#logging.pattern.console=[%d{yyyy-MM-dd HH:mm:ss}] [%level] [%logger{36}] - %msg%n

# ── Swagger / OpenAPI 3 ────────────────────────────────────────────────────────
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.show-actuator=true
springdoc.writer-with-default-pretty-printer=true
